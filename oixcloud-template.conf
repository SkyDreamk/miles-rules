# ============================================
# Surge 配置模板（已脱敏）
# 来源：oixCloud 订阅配置，按个人规则整理
# 使用方法：
#  1. 把「你的服务器地址 / 你的密码 / 你的SNI域名」替换成你自己的节点信息
#  2. 把「你的控制器密码」换成你自己的强密码（不要用弱口令）
#  3. 把「你的订阅API地址」换成你的订阅信息 API（做流量面板用）
#  4. 策略组名（Proxy / AI Suite / Domestic 等）可按需改名，注意 [Rule] 中的引用同步修改
#  5. 本仓库 rules/ 目录下有自维护的规则文件，可替换对应的远程 RULE-SET
# 注意：此模板不含任何真实节点凭据，请勿把填好密码的版本推到公开仓库
# ============================================

